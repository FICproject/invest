buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.5.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    configurations.all {
        resolutionStrategy {
            force("com.facebook.react:react-android:0.76.1")
            dependencySubstitution {
                substitute(module("com.facebook.react:react-native"))
                    .using(module("com.facebook.react:react-android:0.76.1"))
                    .because("In React Native 0.71+, react-native maven coordinates were renamed to react-android")
            }
        }
    }
    repositories {
        google()
        mavenCentral()
        maven {
            // Android React Native AAR artifacts for root & subprojects
            url(new File(rootProject.projectDir, '../node_modules/react-native/android'))
        }
        maven {
            // JSC repository
            url(new File(rootProject.projectDir, '../node_modules/jsc-android/dist'))
        }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
}
